<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: https: http:; media-src 'self' file: blob: https: http:; connect-src 'self' https: http:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>A-X-M</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="background-layer"></div>
    <div id="visualizer" class="hidden"></div>
    <div id="media-viewer" class="hidden"></div>
    <div id="grid-picker" class="hidden"></div>
    <div id="text-entry" class="hidden"></div>
    <div id="options-popup" class="hidden"></div>
    <div id="info-card" class="hidden"></div>
    <div id="transfer-toast" class="hidden"></div>
    <div id="game-bg"></div>

    <div id="app">
      <header id="status-bar">
        <div id="batteries"></div>
        <div id="clock"></div>
      </header>

      <nav id="category-bar"></nav>

      <section id="item-rail"></section>

      <div id="now-playing" class="hidden">
        <div id="np-icon"></div>
        <div id="np-text">
          <div id="np-title"></div>
          <div id="np-folder"></div>
        </div>
        <div id="np-state"></div>
        <div id="np-progress"><div id="np-progress-fill"></div></div>
      </div>

      <div id="footer-hints"></div>
    </div>

    <div id="context-modal" class="hidden">
      <div id="context-panel">
        <h2 id="context-title"></h2>
        <div id="context-details"></div>
        <div id="context-options"></div>
        <div id="context-hint"><span class="btn btn-a"></span> confirm &middot; <span class="btn btn-b"></span> cancel</div>
      </div>
    </div>

    <div id="boot-splash">
      <img id="boot-logo-img" alt="A-X-M" />
      <div id="boot-logo">A-X-M</div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
