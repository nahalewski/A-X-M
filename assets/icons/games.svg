  <!-- DualShock 3 silhouette, drawn to the PS3 pad's proportions rather than a generic
       gamepad: a flat wide top, grips that splay down and outward to rounded tips with a
       deep notch between them, and the twin sticks low and close together above that
       notch. Details are knocked out with fill-rule="evenodd" so the icon stays flat
       white-on-transparent and matches the rest of the XMB set. -->
